# 打 tag（v*）时为 4 个目标（Linux musl x86_64/aarch64、macOS x86_64/aarch64）构建预编译二进制并上传到 GitHub Release；两个 macOS 目标在同一台 macos-15（arm64）runner 上构建。
name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: verify tag matches workspace version
        shell: bash
        run: |
          version=$(cargo metadata --no-deps --format-version 1 --locked | jq -er '. as $metadata | [.packages[] | select(.id as $id | $metadata.workspace_members | index($id)) | .version] | unique | if length == 1 then .[0] else error("workspace versions differ") end')
          if [[ "$GITHUB_REF_TYPE" != "tag" || "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "Release tag must be v$version" >&2
            exit 1
          fi
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
  test:
    needs: verify
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      matrix:
        # 显式 arm64 标签：macos-latest 在发布高峰常常长时间分配不到 runner
        os: [ubuntu-latest, macos-15]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --locked
  build:
    needs: test
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { targets: x86_64-unknown-linux-musl,  os: ubuntu-latest, cross: true, artifact: x86_64-unknown-linux-musl,  toolchain: x86_64-unknown-linux-musl }
          - { targets: aarch64-unknown-linux-musl, os: ubuntu-latest, cross: true, artifact: aarch64-unknown-linux-musl, toolchain: aarch64-unknown-linux-musl }
          # 两个 macOS 目标在同一台 arm64 runner 上构建（x86_64 由 arm64 交叉编译），只需排队一台 mac
          - { targets: "aarch64-apple-darwin x86_64-apple-darwin", os: macos-15, artifact: apple-darwin, toolchain: "aarch64-apple-darwin,x86_64-apple-darwin" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: "${{ matrix.toolchain }}" }
      - uses: Swatinem/rust-cache@v2
        with: { key: "${{ matrix.artifact }}" }
      - uses: taiki-e/install-action@v2
        if: matrix.cross
        with: { tool: cross }
      - name: build and package
        shell: bash
        run: |
          set -euo pipefail
          for target in ${{ matrix.targets }}; do
            if [[ "${{ matrix.cross }}" == "true" ]]; then
              cross build --release --locked --target "$target" -p agentd
            else
              cargo build --release --locked --target "$target" -p agentd
            fi
            name=sub-bot-${GITHUB_REF_NAME}-$target
            mkdir -p "dist/$name"
            cp "target/$target/release/sub-bot" sub-bot.example.json README.md DESIGN.md "dist/$name/"
            (cd dist && tar czf "$name.tar.gz" "$name" && { command -v sha256sum >/dev/null && sha256sum "$name.tar.gz" || shasum -a 256 "$name.tar.gz"; } > "$name.tar.gz.sha256")
          done
      - uses: actions/upload-artifact@v4
        with:
          name: sub-bot-${{ matrix.artifact }}
          if-no-files-found: error
          path: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: sub-bot-*
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          fail_on_unmatched_files: true
          files: |
            artifacts/*.tar.gz
            artifacts/*.tar.gz.sha256
  homebrew:
    needs: publish
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: check tap token
        id: tap-token
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        shell: bash
        run: |
          if [[ -z "$TAP_TOKEN" ]]; then
            echo "::notice::HOMEBREW_TAP_TOKEN is not configured; skipping Homebrew tap update"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.tap-token.outputs.skip != 'true'
        with:
          repository: dickwu/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap
      - name: update formula
        if: steps.tap-token.outputs.skip != 'true'
        shell: bash
        run: scripts/update-tap.sh "${GITHUB_REF_NAME#v}" tap
      - name: publish formula
        if: steps.tap-token.outputs.skip != 'true'
        working-directory: tap
        shell: bash
        run: |
          git add Formula/sub-bot.rb
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898699+github-actions[bot]@users.noreply.github.com'
          git commit -m "sub-bot ${GITHUB_REF_NAME#v}"
          git push origin HEAD:main
