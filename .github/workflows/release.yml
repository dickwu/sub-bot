# 打 tag（v*）时为 4 个目标（Linux musl x86_64/aarch64、macOS x86_64/aarch64）构建预编译二进制并上传到 GitHub Release。
name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: verify tag matches workspace version
        shell: bash
        run: |
          version=$(cargo metadata --no-deps --format-version 1 --locked | jq -er '. as $metadata | [.packages[] | select(.id as $id | $metadata.workspace_members | index($id)) | .version] | unique | if length == 1 then .[0] else error("workspace versions differ") end')
          if [[ "$GITHUB_REF_TYPE" != "tag" || "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "Release tag must be v$version" >&2
            exit 1
          fi
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
  test:
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --locked
  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-musl,  os: ubuntu-latest,  cross: true }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-latest,  cross: true }
          - { target: x86_64-apple-darwin,        os: macos-latest }
          - { target: aarch64-apple-darwin,       os: macos-latest }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: "${{ matrix.target }}" }
      - uses: Swatinem/rust-cache@v2
        with: { key: "${{ matrix.target }}" }
      - uses: taiki-e/install-action@v2
        if: matrix.cross
        with: { tool: cross }
      - name: build (cross)
        if: matrix.cross
        run: cross build --release --locked --target ${{ matrix.target }} -p agentd
      - name: build
        if: ${{ !matrix.cross }}
        run: cargo build --release --locked --target ${{ matrix.target }} -p agentd
      - name: package
        shell: bash
        run: |
          name=sub-bot-${GITHUB_REF_NAME}-${{ matrix.target }}
          mkdir -p "$name"
          cp "target/${{ matrix.target }}/release/sub-bot" sub-bot.example.json README.md DESIGN.md "$name/"
          tar czf "$name.tar.gz" "$name"; f="$name.tar.gz"
          (command -v sha256sum >/dev/null && sha256sum "$f" || shasum -a 256 "$f") > "$f.sha256"
          echo "ASSET=$f" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: sub-bot-${{ matrix.target }}
          if-no-files-found: error
          path: |
            ${{ env.ASSET }}
            ${{ env.ASSET }}.sha256
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: sub-bot-*
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          fail_on_unmatched_files: true
          files: |
            artifacts/*.tar.gz
            artifacts/*.tar.gz.sha256
