[workspace]
resolver = "2"
members = ["crates/agent-ai", "crates/agent-core", "crates/agent-tools", "crates/agent-session", "crates/agentd"]

[workspace.package]
version = "0.10.5"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/dickwu/sub-bot"

[workspace.dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "process", "fs", "io-util", "io-std", "time", "signal"] }
tokio-util = "0.7"
tokio-stream = { version = "0.1", features = ["sync"] }
futures = "0.3"
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# TLS 只用 rustls + ring + webpki-roots（发布为静态 musl 二进制，不引入 aws-lc / openssl）；客户端统一经 agent_ai::http::client_builder() 构建
reqwest = { version = "0.13", default-features = false, features = ["json", "query", "stream", "rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "1"
axum = "0.8"
clap = { version = "4", features = ["derive", "env"] }
anyhow = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-appender = "0.2"
directories = "6"
rand = "0.10"
sha2 = "0.11"
hmac = "0.13"
agent-ai = { path = "crates/agent-ai" }
agent-core = { path = "crates/agent-core" }
agent-tools = { path = "crates/agent-tools" }
agent-session = { path = "crates/agent-session" }

[profile.release]
lto = "thin"
strip = true
