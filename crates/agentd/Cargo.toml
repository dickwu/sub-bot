[package]
name = "agentd"
description = "对外服务进程：HTTP+SSE（带 Bearer token）与 stdio JSONL RPC（对应 coding-agent RPC 模式）"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "sub-bot"
path = "src/main.rs"

# 测试辅助：手写 JSON-RPC 的假 MCP 服务器（stdio），只供 tests/mcp_cli.rs 通过 CARGO_BIN_EXE_sub-bot-fake-mcp 使用，不随发布包分发
[[bin]]
name = "sub-bot-fake-mcp"
path = "tests/support/fake_mcp.rs"
test = false
doc = false

[dependencies]
agent-ai.workspace = true
agent-core.workspace = true
agent-tools.workspace = true
agent-session.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tokio-stream.workspace = true
futures.workspace = true
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
axum.workspace = true
clap.workspace = true
anyhow.workspace = true
uuid.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-appender.workspace = true
directories.workspace = true
rand.workspace = true
sha2.workspace = true
hmac.workspace = true
reqwest.workspace = true
regex = "1"
httpdate = "1"
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
# MCP 客户端（官方 Rust SDK）。stdio 子进程由 mcp.rs 自己 spawn（进程组 + 退出状态），经 transport-async-rw 接入；
# streamable HTTP 用 rmcp 的 reqwest 客户端（与工作区同为 reqwest 0.13，经 agent_ai::http::client_builder() 构建：rustls + ring + webpki-roots，不引入 openssl / aws-lc）
rmcp = { version = "3.10", default-features = false, features = ["client", "transport-async-rw", "transport-streamable-http-client-reqwest", "reqwest-tls-no-provider"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
tower = { version = "0.5", features = ["util"] }
# 进程内 streamable HTTP MCP 服务器（只用于测试 HTTP 传输）
rmcp = { version = "3.10", default-features = false, features = ["server", "transport-streamable-http-server"] }
